<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Fraud Detection System{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <style>
    :root {
      --primary: #1a1f36;
      --accent: #4f46e5;
      --fraud: #ef4444;
      --safe: #22c55e;
      --warning: #f59e0b;
    }
    body { background: #f1f5f9; font-family: 'Segoe UI', sans-serif; }
    .sidebar {
      min-height: 100vh;
      background: var(--primary);
      width: 250px;
      position: fixed;
      top: 0; left: 0;
      padding-top: 1.5rem;
      z-index: 100;
    }
    .sidebar .brand {
      color: #fff;
      font-size: 1.2rem;
      font-weight: 700;
      padding: 0 1.5rem 1.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex; align-items: center; gap: 0.5rem;
    }
    .sidebar .brand i { color: var(--accent); font-size: 1.5rem; }
    .sidebar .nav-link {
      color: rgba(255,255,255,0.7);
      padding: 0.75rem 1.5rem;
      display: flex; align-items: center; gap: 0.75rem;
      transition: all 0.2s;
      border-left: 3px solid transparent;
    }
    .sidebar .nav-link:hover,
    .sidebar .nav-link.active {
      color: #fff;
      background: rgba(79,70,229,0.2);
      border-left-color: var(--accent);
    }
    .main-content {
      margin-left: 250px;
      padding: 2rem;
      min-height: 100vh;
    }
    .card { border: none; border-radius: 12px; box-shadow: 0 1px 6px rgba(0,0,0,0.07); }
    .stat-card { border-left: 4px solid; }
    .stat-card.fraud { border-color: var(--fraud); }
    .stat-card.safe { border-color: var(--safe); }
    .stat-card.total { border-color: var(--accent); }
    .badge-fraud { background: #fee2e2; color: #dc2626; padding: 4px 10px; border-radius: 999px; font-weight: 600; font-size: .8rem; }
    .badge-safe  { background: #dcfce7; color: #16a34a; padding: 4px 10px; border-radius: 999px; font-weight: 600; font-size: .8rem; }
    .result-fraud { border-left: 6px solid var(--fraud); background: #fff5f5; }
    .result-safe  { border-left: 6px solid var(--safe);  background: #f0fdf4; }
    .progress-bar-fraud { background: var(--fraud); }
    .progress-bar-safe  { background: var(--safe); }
    .v-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 0.5rem; }
    .page-header { margin-bottom: 1.75rem; }
    .page-header h2 { font-weight: 700; color: var(--primary); }
    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .main-content { margin-left: 0; }
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>

<!-- Sidebar -->
<nav class="sidebar">
  <div class="brand"><i class="fas fa-shield-halved"></i> FraudGuard AI</div>
  <ul class="nav flex-column mt-3">
    <li class="nav-item">
      <a class="nav-link {% if request.resolver_match.url_name == 'index' %}active{% endif %}" href="{% url 'index' %}">
        <i class="fas fa-gauge-high fa-fw"></i> Dashboard
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link {% if request.resolver_match.url_name == 'predict_single' %}active{% endif %}" href="{% url 'predict_single' %}">
        <i class="fas fa-magnifying-glass-dollar fa-fw"></i> Single Check
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link {% if request.resolver_match.url_name == 'predict_bulk' %}active{% endif %}" href="{% url 'predict_bulk' %}">
        <i class="fas fa-file-csv fa-fw"></i> Bulk Upload
      </a>
    </li>
    <li class="nav-item">
      <a class="nav-link {% if request.resolver_match.url_name == 'history' %}active{% endif %}" href="{% url 'history' %}">
        <i class="fas fa-clock-rotate-left fa-fw"></i> History
      </a>
    </li>
    <li class="nav-item mt-3" style="border-top:1px solid rgba(255,255,255,.1); padding-top:.5rem;">
      <a class="nav-link" href="/api/predict/" target="_blank">
        <i class="fas fa-code fa-fw"></i> API Endpoint
      </a>
    </li>
  </ul>
</nav>

<!-- Main -->
<div class="main-content">
  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
        {{ message }} <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endif %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
